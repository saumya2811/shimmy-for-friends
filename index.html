<title>Shimmy Shimmy Shimmy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pacifico&family=Quicksand:wght@500;600;700&family=Courier+Prime:wght@400;700&display=swap">
<style>
/* Layout: one phone-width column; pink tab card holding the week grid, cream shimmy-meter card below. Single light pastel look by choice. */
:root{
  --page:#FFF7F5; --pink:#FDECEA; --pink-line:#F6BDBB; --pink-mid:#EE9A9B; --pink-deep:#E8898C;
  --rose:#C9717A; --wine:#8E3F46; --cream:#FBF0E2; --cream-line:#EED8BC; --milk:#FFFAF3; --bark:#9A7552;
  --f1-1:#EAF3FC; --f1-2:#B9D8F2; --f1-3:#2C5D8A;
  --f2-1:#FBF3E8; --f2-2:#F1DEC3; --f2-3:#7A5A3A;
  --f3-1:#F4EDFA; --f3-2:#E1D2F1; --f3-3:#6B4C8A;
  --f4-1:#FFF4F2; --f4-2:#F6BDBB; --f4-3:#8E3F46;
  --display:"Pacifico","Brush Script MT",cursive;
  --body:"Quicksand",ui-rounded,"Segoe UI",system-ui,sans-serif;
  --mono:"Courier Prime","Courier New",ui-monospace,monospace;
  color-scheme:light;
}
html,body{background:var(--page)}
body{color:var(--wine);font-family:var(--body);padding-inline:16px;padding-block:20px 32px}
.wrap{max-width:440px;margin:0 auto}
.tab{background:var(--pink);border:0.5px solid var(--pink-line);border-radius:18px;padding:16px 12px}
.title{display:flex;align-items:center;gap:8px;font-family:var(--display);font-size:22px;color:var(--wine);margin:0 0 6px;font-weight:400}
.sub{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:20px}
.jig{position:relative}
.sub .tag{display:inline-flex;align-items:center;gap:5px;background:none;border:0;padding:4px 0;font:600 13px var(--body);color:var(--rose);cursor:pointer}
.tag u{text-decoration:none}
.tag .q{width:13px;height:13px;flex:none;display:block}
.tag .q .ring{fill:none;stroke:var(--pink-deep);stroke-width:1.2;transition:fill .15s}
.tag .q .mark{fill:var(--pink-deep);stroke:var(--pink-deep);transition:fill .15s,stroke .15s}
.sub .tag:hover .q .ring,.sub .tag[aria-expanded="true"] .q .ring{fill:var(--pink-deep)}
.sub .tag:hover .q .mark,.sub .tag[aria-expanded="true"] .q .mark{fill:var(--milk);stroke:var(--milk)}
.jigpop{position:absolute;top:calc(100% + 8px);left:0;z-index:20;width:230px;background:var(--milk);border:0.5px solid var(--pink-line);border-radius:14px;padding:12px 14px;box-shadow:0 8px 24px rgba(142,63,70,.14);font-size:13px;line-height:1.45;color:var(--wine);animation:fade .18s ease}
.jigpop b{display:block;font-family:var(--display);font-weight:400;font-size:16px;margin-bottom:6px}
.jigpop p{margin:0 0 6px}
.jigpop .jigend{margin:0;font-weight:700;color:var(--rose)}
.picker{position:relative}
.wkbtn{display:inline-flex;align-items:center;gap:5px;background:var(--milk);border:0.5px solid var(--pink-line);border-radius:12px;padding:4px 9px;font:600 12px var(--body);color:var(--wine);cursor:pointer}
.wkbtn svg{width:13px;height:13px}
.cal{position:absolute;top:calc(100% + 6px);right:0;z-index:20;width:240px;background:var(--milk);border:0.5px solid var(--pink-line);border-radius:14px;padding:10px;box-shadow:0 8px 24px rgba(142,63,70,.14)}
.cal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;font-weight:700;font-size:13px}
.cal-row{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.dn{font-size:11px;color:var(--rose);text-align:center;padding:2px 0}
.dd{font:600 12px var(--body);color:var(--wine);background:none;border:0;height:28px;border-radius:8px;cursor:pointer;font-variant-numeric:tabular-nums}
.dd.out{color:#E3AFAD}
.dd.wk{background:var(--pink-line)}
.dd.today{box-shadow:inset 0 0 0 1.5px var(--pink-deep)}
.navb{background:none;border:0;color:var(--rose);width:28px;height:28px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center}
.navb svg{width:16px;height:16px}
.banner{background:var(--milk);border:0.5px solid var(--pink-line);border-radius:12px;padding:10px 12px;margin-bottom:12px;font-size:13px;color:var(--wine)}
.banner b{font-weight:700}
.pick{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:8px}
.pick button{border:0;background:none;padding:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;font:700 11px var(--body);color:var(--wine)}
.pick button img{width:100%;max-width:56px;aspect-ratio:1;object-fit:cover;border-radius:6px}
.pick button[disabled]{opacity:.35;cursor:default}
.welcome{text-align:center;padding:28px 16px 24px}
.wtitle{font-family:var(--display);font-weight:400;font-size:28px;margin:0 0 20px;color:var(--wine)}
.wpick{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;max-width:300px;margin:0 auto}
.wpick button{position:relative;border:0;background:var(--milk);border-radius:14px;padding:10px 10px 8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:8px;font:700 15px var(--body);color:var(--wine);opacity:0;
  animation:wpop .5s cubic-bezier(.3,1.5,.6,1) var(--d1) forwards,wfloat var(--fd) ease-in-out var(--d2) infinite}
.wpick button:nth-child(1){--d1:.1s;--d2:.9s;--fd:4.2s}
.wpick button:nth-child(2){--d1:.22s;--d2:1.7s;--fd:4.8s}
.wpick button:nth-child(3){--d1:.34s;--d2:1.3s;--fd:4.5s}
.wpick button:nth-child(4){--d1:.46s;--d2:2.1s;--fd:5s}
@keyframes wpop{from{opacity:0;transform:translateY(10px) scale(.92)}to{opacity:1;transform:none}}
@keyframes wfloat{0%,100%{transform:none}50%{transform:translateY(-4px)}}
.wpick button[aria-disabled="true"]{cursor:default}
.wpick button img{display:block;width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;transition:transform .25s}
.wpick button:not([aria-disabled]):hover img{transform:scale(1.03)}
.wpick button.taken img,.wpick button.taken .wname{opacity:.4}
.wpick small{display:block;font:600 11px var(--body);color:var(--rose);margin-top:-6px}
.wpick small[hidden]{display:none}
.wnote{font-size:13px;color:var(--rose);margin:16px 0 0;min-height:18px}
.linkish{background:none;border:0;padding:0;font:700 12px var(--body);color:var(--rose);text-decoration:underline;cursor:pointer}
.grid{display:grid;grid-template-columns:22px repeat(4,minmax(0,1fr));gap:5px;align-items:center}
.who{display:flex;flex-direction:column;align-items:center;gap:4px}
.who img{width:100%;max-width:56px;aspect-ratio:1;object-fit:cover;border-radius:6px;display:block}
.who i{display:block;width:60%;height:3px;border-radius:2px}
.dy{font-size:12px;font-weight:700;color:var(--rose);text-align:center}
.c{height:32px;border-radius:9px;border:0.5px solid var(--f2-2);padding:0 7px;font:600 11px/32px var(--body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left;transition:background .3s,border-color .3s;min-width:0}
button.c{cursor:pointer}
.c.empty-mine{border:1px dashed var(--pink-deep);background:var(--milk);color:var(--pink-deep);text-align:center;display:flex;align-items:center;justify-content:center}
.c.empty-mine svg{width:14px;height:14px}
.c.sel{outline:1.5px solid var(--pink-deep);outline-offset:1px}
.c.pop{animation:pop .45s ease}
@keyframes pop{0%{transform:scale(.85) rotate(-2deg)}60%{transform:scale(1.07) rotate(1deg)}100%{transform:none}}
.note{margin-top:10px;border-radius:12px;padding:10px 12px;font-size:14px;animation:fade .2s ease}
.note b{font-weight:700}
.note .txt{margin-top:4px;outline:none;min-height:20px}
.note .txt[contenteditable]:empty::before{content:"what did you do?";opacity:.6}
.note-foot{display:flex;justify-content:flex-end;margin-top:8px}
.clear{display:inline-flex;align-items:center;gap:5px;background:var(--milk);border:0.5px solid currentColor;color:inherit;border-radius:12px;padding:4px 10px;font:700 12px var(--body);cursor:pointer}
.clear svg{width:12px;height:12px}
.meter{margin-top:14px;background:var(--cream);border:0.5px solid var(--cream-line);border-radius:14px;padding:12px}
.meter-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.meter-head h2{font-family:var(--display);font-weight:400;font-size:18px;margin:0;color:var(--wine)}
.cnt{font-weight:700;font-size:13px;color:var(--rose);font-variant-numeric:tabular-nums}
.quip{font-size:12px;color:var(--bark);margin:2px 0 6px}
.scale{position:relative;height:156px;margin:0 26px 0 20px}
.track{position:absolute;left:0;right:0;top:68px;height:10px;background:var(--milk);border:0.5px solid var(--cream-line);border-radius:5px}
.bar{height:10px;background:var(--pink-mid);border-radius:5px;width:0;transition:width .8s ease}
.pin{position:absolute;top:62px;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--pink-mid);background:var(--milk);color:var(--pink-deep);display:flex;align-items:center;justify-content:center;z-index:2;transition:background .4s,color .4s}
.pin svg{width:12px;height:12px}
.pin.on{background:var(--pink-mid);color:var(--milk)}
.lb{position:absolute;width:86px;text-align:center;font-size:11px}
.lb .num{color:var(--bark);font-weight:700;margin:2px 0}
.rw{background:var(--milk);border:0.5px solid var(--f2-2);border-radius:10px;padding:4px 6px;color:var(--f2-3);min-height:16px;outline:none;line-height:1.3}
.rw:empty::before{content:"we get to...";color:var(--rose);opacity:.75}
.dash{position:absolute;width:0;border-left:1px dashed var(--pink-deep)}
#cat{position:absolute;top:52px;width:42px;height:42px;border-radius:4px;object-fit:cover;z-index:4;transition:left .8s ease;animation:hop 1s ease-in-out infinite}
@keyframes hop{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-3px) rotate(4deg)}}
@keyframes fade{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.hips{transform-origin:20px 26px;animation:sway .5s ease-in-out infinite alternate}
.arms{transform-origin:20px 17px;animation:wave .5s ease-in-out infinite alternate}
.head{transform-origin:20px 17px;animation:bob .5s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-14deg) translateX(-2px)}to{transform:rotate(14deg) translateX(2px)}}
@keyframes wave{from{transform:rotate(-8deg)}to{transform:rotate(8deg)}}
@keyframes bob{from{transform:translateY(0) rotate(4deg)}to{transform:translateY(-1px) rotate(-4deg)}}
.flag{transform-origin:0 50%;animation:flap .6s ease-in-out infinite alternate}
@keyframes flap{from{transform:skewY(-6deg)}to{transform:skewY(6deg)}}
.tabs{display:flex;gap:4px;background:var(--milk);border:0.5px solid var(--pink-line);border-radius:14px;padding:3px;margin-bottom:20px}
.tabs button{flex:1;min-width:0;border:0;background:none;border-radius:11px;padding:7px 4px;font:700 12px var(--body);color:var(--rose);cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tabs button[aria-selected="true"]{background:var(--pink-line);color:var(--wine)}
.ftitle span{text-wrap:balance;line-height:1.25}
.drum{flex:none;transform-origin:50% 60%;animation:nib 1.4s ease-in-out infinite}
@keyframes nib{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}
.daynav{position:relative;display:flex;align-items:center;justify-content:center;gap:4px;margin:6px 0 16px}
.daynav .navb[aria-disabled="true"]{opacity:.3;cursor:default}
.dcal{right:auto;left:50%;transform:translateX(-50%)}
.dd[aria-disabled="true"]{cursor:default}
.ftools{display:flex;flex-wrap:wrap;align-items:center;gap:12px 8px;margin:4px 0 24px}
.ftitle{margin-top:6px}
.ftools .postpill{margin-left:auto}
.flab{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.flab svg{width:13px;height:13px}
.flab .lav{width:16px;height:16px;border-radius:4px;object-fit:cover;display:block}
.menu{position:absolute;top:calc(100% + 6px);left:0;z-index:20;min-width:160px;background:var(--milk);border:0.5px solid var(--pink-line);border-radius:14px;padding:6px;box-shadow:0 8px 24px rgba(142,63,70,.14);display:flex;flex-direction:column;gap:2px;animation:fade .15s ease}
.menu button{display:flex;align-items:center;gap:8px;border:0;background:none;border-radius:10px;padding:7px 10px;font:600 13px var(--body);color:var(--wine);cursor:pointer;text-align:left;white-space:nowrap}
.menu button:hover{background:var(--pink)}
.menu button[aria-checked="true"]{background:var(--pink-line);font-weight:700}
.menu img{width:22px;height:22px;border-radius:6px;object-fit:cover;display:block}
.menu svg{width:16px;height:16px}
.menu .me{width:22px;text-align:center}
.fpick{position:relative;display:flex;align-items:center;gap:4px}
.clr{border:0;background:none;color:var(--rose);font:700 15px var(--body);cursor:pointer;padding:0 4px;line-height:1}
.postpill{display:inline-flex;align-items:center;gap:4px;border:0.5px solid var(--pink-deep);background:var(--milk);color:var(--pink-deep);border-radius:12px;padding:4px 10px;font:700 12px var(--body);cursor:pointer}
.postpill svg{width:12px;height:12px}
.dcal{left:0;right:auto;transform:none}
.cal-foot{display:flex;flex-direction:column;align-items:center;gap:4px;margin-top:8px}
.cal-hint{font-size:11px;color:var(--bark)}
.dd.rng{background:var(--pink)}
.dd.has{position:relative}
.dd.has::after{content:"";position:absolute;left:50%;bottom:3px;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--pink-deep)}
.feed{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:3px;border-radius:12px;overflow:hidden}
.tile{position:relative;aspect-ratio:1;max-width:100%;overflow:hidden}
.t-open{display:block;width:100%;height:100%;border:0;padding:0;background:none;cursor:pointer}
.t-open img{display:block;width:100%;height:100%;object-fit:cover}
.t-open img:not([src]){visibility:hidden}
.t-who{position:absolute;top:5px;left:5px;display:flex;align-items:center;gap:4px;max-width:calc(100% - 10px);border-radius:8px;padding:2px 6px 2px 2px;font:700 10px var(--body);pointer-events:none;box-shadow:0 1px 2px rgba(142,63,70,.15)}
.t-who img{width:16px;height:16px;border-radius:5px;object-fit:cover;flex:none}
.t-who span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.t-date{position:absolute;left:5px;bottom:5px;background:rgba(255,250,243,.92);border-radius:8px;padding:1px 6px;font:700 10px var(--body);color:var(--wine);pointer-events:none}
.t-like{position:absolute;right:5px;bottom:5px;display:inline-flex;align-items:center;gap:3px;border:0;background:rgba(255,250,243,.95);border-radius:9px;padding:3px 6px;font:700 10px var(--body);color:var(--wine);cursor:pointer;box-shadow:0 1px 2px rgba(142,63,70,.18)}
.t-like .hrt{width:14px;height:14px;display:block}
.t-like[disabled]{cursor:default}
.food-err{margin:0 0 10px}
.ctools{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 8px;margin:4px 0 20px}
.cwk{display:inline-flex;align-items:center;gap:2px;background:var(--milk);border:0.5px solid var(--pink-line);border-radius:12px;padding:1px 2px;font:600 12px var(--body);color:var(--wine)}
.cwk span{min-width:88px;text-align:center}
.cwk .navb{width:26px;height:26px}
.cwk .navb[aria-disabled="true"]{opacity:.3;cursor:default}
.cc{height:34px;border-radius:9px;border:0.5px solid var(--pink-line);background:var(--milk);display:flex;align-items:center;justify-content:center;padding:0;min-width:0}
.cc .cupsvg{width:19px;height:17px;display:block}
.cc:not(.full):not(.mine){border-color:transparent;background:rgba(255,250,243,.5)}
.cc:not(.full):not(.mine) .cupsvg{opacity:.18}
.cc.mine:not(.full) .cupsvg{opacity:.5}
button.cc{cursor:pointer}
.cc.mine{border:1px dashed var(--pink-deep)}
.cc.mine.full{border:0.5px solid var(--pink-line)}
.cc.fut{opacity:.45}
.cc.pop .cupsvg{animation:pop .5s ease}
.dy.tdy{color:var(--wine);text-decoration:underline;text-decoration-color:var(--pink-deep);text-decoration-thickness:2px;text-underline-offset:3px}
.ideatoggle{display:block;margin:8px 2px 6px}
.idl{list-style:none;margin:0 0 12px;padding:0;display:flex;flex-direction:column}
.idl li{display:flex;align-items:center;gap:8px;padding:9px 4px;border-bottom:0.5px dashed var(--pink-line);font-size:14px;line-height:1.4;overflow-wrap:anywhere}
.idl li:last-child{border-bottom:0}
.idl li span{flex:1;min-width:0}
.idl li.empty{color:var(--rose);font-size:13px}
.idl button{flex:none;border:0;background:none;color:var(--rose);font:700 15px var(--body);cursor:pointer;padding:0 4px;line-height:1}

.cweek{display:flex;align-items:center;gap:2px;margin:2px 0 4px}
.cweek .navb[aria-disabled="true"]{opacity:.3;cursor:default}
.cdays{flex:1;min-width:0;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
.cdbtn{display:flex;flex-direction:column;align-items:center;gap:3px;border:0;background:none;border-radius:10px;padding:6px 0;cursor:pointer;font:700 11px var(--body);color:var(--rose)}
.cdbtn b{font:700 13px var(--body);color:var(--wine);font-variant-numeric:tabular-nums}
.cdbtn[aria-pressed="true"]{background:var(--milk);box-shadow:inset 0 0 0 1px var(--pink-mid)}
.cdbtn.today b{text-decoration:underline;text-decoration-color:var(--pink-deep);text-decoration-thickness:2px;text-underline-offset:3px}
.cdbtn[aria-disabled="true"]{opacity:.35;cursor:default}
.cdots{display:flex;gap:2px}
.cdots i{width:5px;height:5px;border-radius:50%;opacity:.25}
.cdots i.on{opacity:1}
.cday-label{text-align:center;font:700 12px var(--body);color:var(--rose);margin:10px 0 14px}
.cups{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.cupcard{display:flex;flex-direction:column;align-items:center;gap:6px;background:var(--milk);border:0.5px solid;border-radius:16px;padding:10px 10px 12px;font:inherit;color:var(--wine);text-align:center;min-width:0}
button.cupcard{cursor:pointer}
button.cupcard:hover{box-shadow:0 2px 8px rgba(142,63,70,.12)}
.cuphead{display:flex;align-items:center;gap:6px;align-self:stretch}
.cuphead img{width:22px;height:22px;border-radius:6px;object-fit:cover;display:block}
.cuphead b{font-size:12px;font-weight:700}
.cuphead .you{margin-left:auto;font-size:10px;font-weight:700;opacity:.7}
.cupsvg{width:72px;height:63px;display:block;overflow:visible}
.cupsvg .steam path{fill:none;stroke:#E8898C;stroke-width:2;stroke-linecap:round;animation:steam 2.4s ease-in-out infinite}
.cupsvg .steam path:nth-child(2){animation-delay:.8s}
@keyframes steam{0%{opacity:0;transform:translateY(4px)}40%{opacity:1}100%{opacity:0;transform:translateY(-4px)}}
.cuptxt{margin:0;font-size:12px;line-height:1.35;overflow-wrap:anywhere;min-height:16px}
.cuptxt.hint{color:var(--pink-deep);font-weight:700}
.cupcard.pop .cupsvg{animation:pop .5s ease}
.jar{margin-top:22px;background:var(--milk);border:0.5px solid var(--pink-line);border-radius:16px;padding:12px}
.jar-h{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 8px;margin-bottom:10px}
.jar-h span{font-family:var(--display);font-size:17px;color:var(--wine)}
.jar-h small{font-size:11px;color:var(--rose)}
.ideas{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.idea{display:inline-flex;align-items:center;gap:5px;background:var(--pink);border:0.5px solid var(--pink-line);border-radius:14px;padding:4px 8px 4px 10px;font:600 12px var(--body);color:var(--wine);max-width:100%}
.idea span{overflow-wrap:anywhere}
.idea small{font-size:10px;color:var(--rose);flex:none}
.idea button{border:0;background:none;color:var(--rose);font:700 13px var(--body);cursor:pointer;padding:0 2px;line-height:1}
.ideapick{cursor:pointer;font-family:var(--body)}
.ideapick:hover{border-color:var(--pink-mid)}
.cookpill{margin-left:auto;border-color:var(--pink-line);color:var(--wine)}
.ftools .cookpill + .postpill{margin-left:0}
.recbox{margin:10px 2px 0}
.recbtn{display:inline-flex;align-items:center;gap:6px}
.rthumb{flex:none;width:44px;height:44px;border-radius:8px;overflow:hidden;background:var(--pink)}
.rthumb img{width:100%;height:100%;object-fit:cover;display:block}
.rthumb img:not([src]){visibility:hidden}
.rec-h{margin:10px 0 6px;font:700 11px var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--rose)}
.rec-h:first-child{margin-top:2px}
.ingl{display:flex;flex-wrap:wrap;gap:5px}
.ing{background:var(--pink);border:0.5px solid var(--pink-line);border-radius:12px;padding:3px 9px;font:600 12px var(--body);color:var(--wine)}

<script>
/* ---------- your friends ----------
   Put your group's names here (up to four). Each friend gets one of the four pastel color sets above (--f1 to --f4).
   For photos, add square images next to this file (for example img/ana.jpg) and set img:'img/ana.jpg'.
   Leave img empty and she gets a pastel square with her initial instead. */
const FRIENDS=[
  {name:'Ana', img:''},
  {name:'Bea', img:''},
  {name:'Cleo',img:''},
  {name:'Dani',img:''}
];
const PEOPLE=FRIENDS.slice(0,4).map((f,i)=>({id:f.name,img:f.img,c:['--f'+(i+1)+'-1','--f'+(i+1)+'-2','--f'+(i+1)+'-3']}));
(function(){const cs=getComputedStyle(document.documentElement);
  PEOPLE.forEach(p=>{if(p.img)return;const bg=cs.getPropertyValue(p.c[1]).trim()||'#F6BDBB',fg=cs.getPropertyValue(p.c[2]).trim()||'#8E3F46';
    const svg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="${bg}"/><text x="50" y="50" dy=".35em" text-anchor="middle" font-family="Quicksand,Arial,sans-serif" font-weight="700" font-size="48" fill="${fg}">${(p.id[0]||'?').toUpperCase()}</text></svg>`;
    p.img='data:image/svg+xml,'+encodeURIComponent(svg)})})();
const DAYS=['M','T','W','T','F','S','S'],FULL=['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'],MONF=['January','February','March','April','May','June','July','August','September','October','November','December'];
const ICON={
  plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>',
  heart:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg>',
  star:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/></svg>',
  crown:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" aria-hidden="true"><path d="M4 8l4 4 4-7 4 7 4-4-2 11H6z"/></svg>',
  x:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  left:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>',
  right:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>'
};
const M=[{at:10,ic:'heart',pos:'below'},{at:18,ic:'star',pos:'above'},{at:28,fin:true,pos:'below'}];
const QUIPS=[[0,'teamwork, dream work'],[10,'look at us, practically athletes'],[18,'legs are legging. the group chat is proud'],[28,'too glam to skip a walk']];
const v=(n)=>`var(${n})`;
const $=(id)=>document.getElementById(id);
const today=new Date();today.setHours(0,0,0,0);
const monday=(d)=>{const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-((x.getDay()+6)%7));return x};
const pad=(n)=>String(n).padStart(2,'0');
const dkey=(d)=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const dayKey=(i)=>{const d=new Date(ws);d.setDate(ws.getDate()+i);return dkey(d)};
let ws=monday(today),calM=new Date(ws.getFullYear(),ws.getMonth(),1),calOpen=false,sel=null;

/* ---------- shared state ---------- */
let db=null,me=null,canWrite=true,status='loading';
let claims={};            // uid -> {name, at}
let logs={};              // uid -> {days:{'YYYY-MM-DD': text}}
let rewards={};           // weekKey -> ['', '', '']
let myDays={},dirty=false,saveTimer=null,saving=Promise.resolve();
const rwTimers={};

function uidFor(name){let best=null;for(const [uid,c] of Object.entries(claims)){if(c&&c.name===name&&(!best||c.at<claims[best].at))best=uid}return best}
function myName(){if(!me||!claims[me])return null;const n=claims[me].name;return uidFor(n)===me?n:null}
function daysOf(name){const uid=uidFor(name);if(!uid)return {};if(uid===me)return myDays;return (logs[uid]&&logs[uid].days)||{}}
function entry(name,i){const d=daysOf(name);const k=dayKey(i);return Object.prototype.hasOwnProperty.call(d,k)?d[k]:null}

function blocked(){canWrite=false;closeNote();render(false);renderBanner();if(typeof renderFood==='function')renderFood();if(typeof renderCup==='function')renderCup()}
function saveMine(){
  if(!db||!me)return;clearTimeout(saveTimer);
  saveTimer=setTimeout(()=>{
    const body={days:JSON.parse(JSON.stringify(myDays))};
    saving=saving.then(()=>db.doc('logs/'+me).set(body)).then(()=>{dirty=false}).catch(e=>{if(e&&e.code==='invalid_argument')blocked()});
  },450);
}
function saveReward(wk){
  if(!db)return;clearTimeout(rwTimers[wk]);
  rwTimers[wk]=setTimeout(()=>{db.doc('rewards/'+wk).set({r:rewards[wk].slice()}).catch(e=>{if(e&&e.code==='invalid_argument')blocked()})},600);
}

/* ---------- meter scaffolding ---------- */
const g=$('g'),note=$('note'),scale=$('scale'),cw=$('calwrap'),banner=$('banner');
let checks='';for(let y=0;y<10;y++)for(let x=0;x<2;x++)checks+=`<rect x="${x*5}" y="${y*5}" width="5" height="5" fill="${(x+y)%2?'#FFFAF3':'#8E3F46'}"/>`;

/* ---------- calendar ---------- */
function label(){const e=new Date(ws);e.setDate(ws.getDate()+6);return ws.getMonth()===e.getMonth()?`${MON[ws.getMonth()]} ${ws.getDate()} – ${e.getDate()}`:`${MON[ws.getMonth()]} ${ws.getDate()} – ${MON[e.getMonth()]} ${e.getDate()}`}
function drawCal(){
  $('wkbtn').setAttribute('aria-expanded',calOpen);
  if(!calOpen){cw.innerHTML='';return}
  const y=calM.getFullYear(),m=calM.getMonth(),start=monday(new Date(y,m,1)),we=new Date(ws);we.setDate(ws.getDate()+6);
  let cells='';for(let k=0;k<42;k++){const d=new Date(start);d.setDate(start.getDate()+k);if(k===35&&d.getMonth()!==m)break;
    cells+=`<button class="dd${d.getMonth()!==m?' out':''}${d>=ws&&d<=we?' wk':''}${d.getTime()===today.getTime()?' today':''}" data-t="${d.getTime()}">${d.getDate()}</button>`}
  cw.innerHTML=`<div class="cal" role="dialog" aria-label="Pick a week"><div class="cal-head"><button class="navb" id="cp" aria-label="Previous month">${ICON.left}</button><span>${MONF[m]} ${y}</span><button class="navb" id="cn" aria-label="Next month">${ICON.right}</button></div><div class="cal-row">${['M','T','W','T','F','S','S'].map(x=>`<div class="dn">${x}</div>`).join('')}</div><div class="cal-row">${cells}</div></div>`;
  $('cp').onclick=e=>{e.stopPropagation();calM=new Date(y,m-1,1);drawCal()};
  $('cn').onclick=e=>{e.stopPropagation();calM=new Date(y,m+1,1);drawCal()};
  cw.querySelectorAll('.dd').forEach(b=>b.onclick=e=>{e.stopPropagation();ws=monday(new Date(+b.dataset.t));calOpen=false;drawCal();render()});
}
const jigbtn=$('jigbtn'),jigpop=$('jigpop');
function setJig(on){jigpop.hidden=!on;jigbtn.setAttribute('aria-expanded',String(on))}
jigbtn.onclick=e=>{e.stopPropagation();const on=jigpop.hidden;if(on&&calOpen){calOpen=false;drawCal()}setJig(on)};
jigpop.addEventListener('click',e=>e.stopPropagation());
$('wkbtn').onclick=e=>{e.stopPropagation();setJig(false);calOpen=!calOpen;calM=new Date(ws.getFullYear(),ws.getMonth(),1);drawCal()};
cw.addEventListener('click',e=>e.stopPropagation());

const photoCache={},photoWait={},qs={};
const sheet=$('sheet'),dcw=$('dcalwrap');
const clone=(o)=>JSON.parse(JSON.stringify(o));
const esc=(s)=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const newId=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const fdKey=()=>dkey(fd);
const splitKey=(k)=>{const i=k.indexOf(':');return [k.slice(0,i),k.slice(i+1)]};
function nameOf(uid){const c=claims[uid];return c&&uidFor(c.name)===uid?c.name:null}
function canPost(){return !!(db&&me&&canWrite&&myName())}
function put(path,body,kind){busy[kind]++;const p=(qs[path]||Promise.resolve()).catch(()=>{}).then(()=>db.doc(path).set(body));qs[path]=p;return p.finally(()=>{busy[kind]--})}
function writeErr(e,show){
  let msg="That didn't go through. Try again in a moment.";
  if(e&&e.code==='invalid_argument'){blocked();msg='You can look but not post yet. Ask the person who made this page to share it with you as an Editor.'}
  else if(e&&e.code==='quota_exceeded')msg='The photo shelf is full. Let the person who made this page know.';
  if(show)show(msg);
}
function itemsOf(uid){if(uid===me)return myPosts;return (posts[uid]&&posts[uid].items)||{}}
function postItem(uid,pid){const it=itemsOf(uid);return it[pid]||null}
function dayPosts(name){const uid=uidFor(name);if(!uid)return [];const it=itemsOf(uid),k=fdKey();
  return Object.keys(it).filter(pid=>SEG.test(pid)&&it[pid]&&it[pid].date===k).map(pid=>Object.assign({uid,pid},it[pid])).sort((a,b)=>(a.at||0)-(b.at||0))}
function allUids(src){const s=new Set(Object.keys(src));if(me)s.add(me);return [...s]}
function rxFor(key){const out={};allUids(reacts).forEach(uid=>{const r=uid===me?myReacts:((reacts[uid]&&reacts[uid].r)||{});const arr=r[key];if(Array.isArray(arr))arr.forEach(e=>{if(RX.some(x=>x[0]===e))(out[e]=out[e]||[]).push(uid)})});return out}
function cmFor(key){const out=[];allUids(comments).forEach(uid=>{const c=uid===me?myComments:((comments[uid]&&comments[uid].c)||{});for(const [cid,x] of Object.entries(c)){if(x&&x.p===key&&typeof x.t==='string')out.push({uid,cid,t:x.t,at:x.at||0})}});return out.sort((a,b)=>a.at-b.at)}
function fillImg(img,uid,pid){const k=uid+':'+pid;if(photoCache[k]){img.src=photoCache[k];return}
  if(!db||!SEG.test(uid)||!SEG.test(pid))return;
  if(!photoWait[k]){let ref;try{ref=db.doc('photos/'+uid+'/p/'+pid)}catch(_){return}
    photoWait[k]=ref.get().then(s=>{const d=s.exists?s.data().d:null;if(typeof d==='string'&&d.startsWith('data:image/'))photoCache[k]=d;else delete photoWait[k];return photoCache[k]||null}).catch(()=>{delete photoWait[k];return null})}
  photoWait[k].then(d=>{if(d&&img.isConnected)img.src=d})}
function fmtTime(at){if(!at)return '';const d=new Date(at);let h=d.getHours();const m=pad(d.getMinutes()),ap=h<12?'am':'pm';h=h%12||12;return `${h}:${m} ${ap}`}
const dm=(d)=>`${d.getDate()}/${d.getMonth()+1}`;
const oneDay=()=>!!fday&&!!fto&&fday.getTime()===fto.getTime();
function dayLabel(){if(!fday)return 'All days';if(!oneDay())return `${dm(fday)} – ${dm(fto)}`;const diff=Math.round((today-fday)/864e5);return diff===0?`Today · ${dm(fday)}`:diff===1?`Yesterday · ${dm(fday)}`:`${WD[fday.getDay()]} ${dm(fday)}`}

let foodErr='';

  return Object.keys(it).filter(pid=>SEG.test(pid)&&it[pid]&&typeof it[pid].date==='string'&&DATE_RE.test(it[pid].date)).map(pid=>Object.assign({uid,pid},it[pid]))}

        put('posts/'+me,{items:clone(myPosts)},'posts').catch(er=>writeErr(er,showErr))};
      row.append(cancel,save);capbox.append(ta,row);ta.focus();return;

function refreshSheet(){

    return `<button class="rxb${on?' on':''}" data-e="${e}" ${can?'':'disabled'} aria-pressed="${on}" aria-label="${l}${who.length?', '+who.length:''}" title="${esc(names)}"><span class="e">${e}</span>${who.length?`<span>${who.length}</span>`:''}</button>`}).join('');

let sampler=null,pantryText='',lastFind=null;
const recipeCache={},recipeWait={};
const parseIng=(s)=>String(s||'').split(/[\n,;]+/).map(x=>x.trim()).filter(Boolean).slice(0,30).map(x=>x.slice(0,40));
const ingOf=(x)=>Array.isArray(x&&x.ing)?x.ing.filter(i=>typeof i==='string').slice(0,30):[];
function getSteps(uid,pid){const k=uid+':'+pid;if(k in recipeCache)return Promise.resolve(recipeCache[k]);
  if(!db||!SEG.test(uid)||!SEG.test(pid))return Promise.resolve('');
  if(!recipeWait[k])recipeWait[k]=db.doc('recipes/'+uid+'/r/'+pid).get().then(s=>{const t=s.exists&&typeof s.data().steps==='string'?s.data().steps:'';recipeCache[k]=t;return t}).catch(()=>{delete recipeWait[k];return ''});
  return recipeWait[k]}
function dishName(x){if(x.cap)return x.cap.length>70?x.cap.slice(0,68)+'…':x.cap;const mo=mealOf(x.meal);return `${x.who?x.who.id:'A friend'}'s ${mo?mo[1].toLowerCase():'dish'}`}

function mountRecipe(box,uid,pid,mineP,start){
  const inRec=!!start;
  const draw=async(mode)=>{
    const x=postItem(uid,pid)||{},ing=ingOf(x),has=ing.length||x.hr;box.innerHTML='';
    if(mode==='edit'&&mineP){
      const steps=x.hr?await getSteps(uid,pid):'';if(!box.isConnected)return;box.innerHTML='';
      const l1=document.createElement('label');l1.className='flabel';l1.textContent='Ingredients';
      const t1=document.createElement('textarea');t1.className='field';t1.rows=2;t1.maxLength=1200;t1.placeholder='eggs, tomato, garlic, butter';t1.value=ing.join(', ');t1.setAttribute('aria-label','Ingredients');
      const l2=document.createElement('label');l2.className='flabel';l2.textContent='How you made it';
      const t2=document.createElement('textarea');t2.className='field';t2.rows=4;t2.maxLength=4000;t2.placeholder='1. Boil the eggs for 7 minutes…';t2.value=steps;t2.setAttribute('aria-label','Recipe steps');
      const row=document.createElement('div');row.className='cap-actions';
      const cancel=document.createElement('button');cancel.className='btn ghost';cancel.textContent='Cancel';cancel.onclick=()=>draw(has?'open':'closed');
      const save=document.createElement('button');save.className='btn';save.textContent='Save recipe';
      save.onclick=async()=>{const it=myPosts[pid];if(!it)return;const ni=parseIng(t1.value),ns=t2.value.trim().slice(0,4000);
        if(ni.length)it.ing=ni;else delete it.ing;if(ns)it.hr=true;else delete it.hr;recipeCache[uid+':'+pid]=ns;
        save.setAttribute('aria-busy','true');save.textContent='Saving…';
        try{if(ns)await put('recipes/'+me+'/r/'+pid,{steps:ns},'posts');else if(x.hr)await db.doc('recipes/'+me+'/r/'+pid).delete();
          await put('posts/'+me,{items:clone(myPosts)},'posts');renderFood();draw(ni.length||ns?'open':'closed')}
        catch(er){save.removeAttribute('aria-busy');save.textContent='Save recipe';writeErr(er,showErr)}};
      row.append(cancel,save);box.append(l1,t1,l2,t2,row);t1.focus();return;
    }
    if(mode==='open'&&has){
      const h=document.createElement('div');h.className='rec-h';h.textContent='Ingredients';box.append(h);
      if(ing.length){const ul=document.createElement('div');ul.className='ingl';ing.forEach(i=>{const s=document.createElement('span');s.className='ing';s.textContent=i;ul.append(s)});box.append(ul)}
      else{const n=document.createElement('p');n.className='rec-p';n.textContent='No ingredients listed.';box.append(n)}
      if(x.hr){const h2=document.createElement('div');h2.className='rec-h';h2.textContent='How to make it';const p2=document.createElement('p');p2.className='rec-p';p2.textContent='Loading…';box.append(h2,p2);
        getSteps(uid,pid).then(t=>{if(p2.isConnected)p2.textContent=t||'No steps written yet.'})}
      const row=document.createElement('div');row.className='rec-actions';
      if(mineP){const ed=document.createElement('button');ed.className='linkish';ed.textContent='Edit recipe';ed.onclick=()=>draw('edit');row.append(ed)}
      box.append(row);return;
    }
    if(inRec){closeRecipe();return}
    if(has){const b=document.createElement('button');b.className='btn recbtn';b.textContent='🍳 Get recipe';b.onclick=()=>openRecipe(uid,pid,'open');box.append(b)}
    else if(mineP){const b=document.createElement('button');b.className='linkish';b.textContent='Add ingredients & recipe';b.onclick=()=>openRecipe(uid,pid,'edit');box.append(b)}
    box.hidden=!has&&!mineP;
  };
  draw(start||'closed');
}

const STAPLES=new Set(['salt','pepper','black pepper','oil','water','sugar','cooking oil','olive oil']);
const normIng=(s)=>String(s).toLowerCase().replace(/\(.*?\)/g,'').replace(/[^a-z\s]/g,' ').replace(/\b(fresh|chopped|sliced|diced|minced|large|small|cup|cups|tbsp|tsp|g|kg|ml|of|a|some)\b/g,' ').replace(/\s+/g,' ').trim().replace(/(oes|es|s)$/,m=>m==='oes'?'o':'');
function localRank(have,cands){
  const H=have.map(normIng).filter(Boolean);
  return cands.map(c=>{const need=ingOf(c).map(n=>({raw:n,k:normIng(n)})).filter(n=>n.k&&!STAPLES.has(n.k));
    if(!need.length)return null;
    const hit=need.filter(n=>H.some(h=>h===n.k||h.includes(n.k)||n.k.includes(h)));
    const miss=need.filter(n=>!hit.includes(n));
    return {c,score:Math.round(100*hit.length/need.length),have:hit.map(n=>n.raw),swaps:[],missing:miss.map(n=>n.raw),tip:''}})
    .filter(r=>r&&r.score>0).sort((a,b)=>b.score-a.score).slice(0,6);
}
function finderCands(){const out=[];PEOPLE.forEach(p=>postsOfName(p.id).forEach(x=>{if(ingOf(x).length)out.push(Object.assign({who:p},x))}));return out}
function openFinder(){
  openKey=null;
  openSheet(`<div class="sheet" role="dialog" aria-modal="true" aria-label="What can I make?">
    <div class="sh-head"><div><b>What can I make?</b><small>from dishes your friends have posted</small></div><button class="navb" data-close aria-label="Close">${ICON.x}</button></div>

    <textarea class="field" id="pantry" rows="2" maxlength="600" placeholder="eggs, tomatoes, garlic, butter"></textarea>
    <p class="sh-err" id="perr" hidden></p>
    <div class="sh-actions"><button class="btn" id="pfind">Find dishes</button></div>
    <div id="presults" class="fresults"></div>
  </div>`);
  const ta=$('pantry');ta.value=pantryText;ta.oninput=()=>{pantryText=ta.value;$('perr').hidden=true};
  $('pfind').onclick=findDishes;
  if(lastFind)paintFind(lastFind);

async function findDishes(){
  const er=$('perr'),out=$('presults'),btn=$('pfind');if(!out)return;
  const have=parseIng(pantryText);
  if(!have.length){er.textContent='Add at least one ingredient first.';er.hidden=false;return}
  const cands=finderCands();
  if(!cands.length){lastFind=null;out.innerHTML=`<div class="feed-empty">No one has added ingredients to a post yet. Open one of your posts and tap "Add ingredients & recipe" to start.</div>`;return}
  btn.setAttribute('aria-busy','true');btn.textContent='Finding…';out.innerHTML=`<div class="sh-wait">Looking through your friends' dishes…</div>`;
  let ranked=null,by='match';
  if(sampler){
    const lines=cands.slice(0,80).map(c=>JSON.stringify({id:c.uid+':'+c.pid,dish:dishName(c),ingredients:ingOf(c)})).join('\n');
    const prompt=`A friend wants to cook something tonight. They have: ${have.join(', ')}.\n`+
      `Below are dishes their friends posted, one JSON object per line, with each dish's ingredients.\n${lines}\n\n`+
      `Pick up to 6 dishes they could make most closely with what they have. Treat salt, pepper, oil, water and sugar as always available. `+
      `Suggest sensible swaps for missing ingredients using what they have (e.g. ghee for butter). Leave out dishes that would need several key ingredients they don't have. `+
      `Reply with only a JSON array, best match first, like: [{"id":"<id from the list>","score":85,"have":["eggs"],"swaps":[{"missing":"ghee","use":"butter"}],"missing":["onion"],"tip":"one short friendly line"}]`;
    try{
      const res=await sampler.json(prompt,{modelTier:'quick'});
      if(Array.isArray(res)){const byId=new Map(cands.map(c=>[c.uid+':'+c.pid,c]));
        ranked=res.filter(r=>r&&byId.has(String(r.id))).slice(0,6).map(r=>({c:byId.get(String(r.id)),score:Math.max(0,Math.min(100,Math.round(Number(r.score)||0))),
          have:(Array.isArray(r.have)?r.have:[]).map(String).slice(0,12),
          swaps:(Array.isArray(r.swaps)?r.swaps:[]).filter(s=>s&&s.missing&&s.use).map(s=>({missing:String(s.missing).slice(0,40),use:String(s.use).slice(0,40)})).slice(0,6),
          missing:(Array.isArray(r.missing)?r.missing:[]).map(String).slice(0,12),tip:String(r.tip||'').slice(0,160)}));by='claude'}
    }catch(e){if(e&&['not_granted','sampling_disabled','not_declared','capability_disabled','capability_removed'].includes(e.code))sampler=null}
  }
  if(!ranked){ranked=localRank(have,cands);by='match'}
  lastFind={ranked,by};
  if(!$('presults'))return;
  btn.removeAttribute('aria-busy');btn.textContent='Find dishes';paintFind(lastFind);
}
function paintFind(f){
  const out=$('presults');if(!out)return;
  if(!f.ranked.length){out.innerHTML=`<div class="feed-empty">Nothing close yet. Try adding a few more ingredients.</div>`;return}
  out.innerHTML=`<p class="fnote">${f.by==='claude'?'Picked by Claude, with swaps from your kitchen':'Matched by ingredients'}</p>`+f.ranked.map(r=>{const c=r.c,mo=mealOf(c.meal);
    return `<button class="fres" data-k="${esc(c.uid+':'+c.pid)}"><span class="fth" style="background:${v(c.who.c[1])}"><img data-u="${esc(c.uid)}" data-p="${esc(c.pid)}" alt=""></span>`+
      `<span class="fmain"><b>${esc(dishName(c))}</b><small>by ${c.who.id}${mo?' · '+mo[2]+' '+mo[1]:''}</small>`+
      `<span class="fbar"><i style="width:${r.score}%"></i></span>`+
      (r.have.length?`<span class="fline"><em>Have</em> ${esc(r.have.join(', '))}</span>`:'')+
      (r.swaps.length?`<span class="fline"><em>Swap</em> ${esc(r.swaps.map(s=>s.missing+' → '+s.use).join(', '))}</span>`:'')+
      (r.missing.length?`<span class="fline"><em>Need</em> ${esc(r.missing.join(', '))}</span>`:'')+
      (r.tip?`<span class="ftip">${esc(r.tip)}</span>`:'')+`</span></button>`}).join('');
  out.querySelectorAll('img[data-p]').forEach(img=>fillImg(img,img.dataset.u,img.dataset.p));
  out.querySelectorAll('.fres').forEach(b=>b.onclick=()=>{const [u,p]=splitKey(b.dataset.k);openPost(u,p,true)});
}

async function shrink(file){
  const url=URL.createObjectURL(file);
  try{
    const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url});
    let max=900,q=0.72,out='';
    for(let t=0;t<6;t++){
      const s=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight)),c=document.createElement('canvas');
      c.width=Math.max(1,Math.round(img.naturalWidth*s));c.height=Math.max(1,Math.round(img.naturalHeight*s));
      const ctx=c.getContext('2d');ctx.fillStyle='#FFFAF3';ctx.fillRect(0,0,c.width,c.height);ctx.drawImage(img,0,0,c.width,c.height);
      out=c.toDataURL('image/jpeg',q);if(out.length<170000)break;
      max=Math.round(max*0.82);q=Math.max(0.5,q-0.06);
    }
    return out;
  }finally{URL.revokeObjectURL(url)}
}

    </div>`);
    sheet.querySelectorAll('textarea[data-ci]').forEach(t=>{const it=items[+t.dataset.ci];t.value=it.cap;t.oninput=()=>{it.cap=t.value}});
    sheet.querySelectorAll('textarea[data-ii]').forEach(t=>{const it=items[+t.dataset.ii];t.value=it.ing||'';t.oninput=()=>{it.ing=t.value}});
    sheet.querySelectorAll('textarea[data-si]').forEach(t=>{const it=items[+t.dataset.si];t.value=it.rec||'';t.oninput=()=>{it.rec=t.value}});
    sheet.querySelectorAll('.rtoggle').forEach(b=>b.onclick=()=>{const it=items[+b.dataset.ri];it.showRec=!it.showRec;draw()});
    sheet.querySelectorAll('.mpick[data-mi]').forEach(box=>{const it=items[+box.dataset.mi];
      const paint=()=>{box.innerHTML=mealChips(it.meal);box.querySelectorAll('.mchip').forEach(b=>b.onclick=()=>{it.meal=b.dataset.m;paint()})};paint()});
    sheet.querySelectorAll('.bx').forEach(b=>b.onclick=()=>{items.splice(+b.dataset.x,1);note='';draw()});
    const pb=$('postbtn');
    pb.onclick=async()=>{
      if(pb.getAttribute('aria-busy')==='true')return;pb.setAttribute('aria-busy','true');
      const total=items.length;let done=0;
      try{
        for(const it of items){
          if(it.pid){done++;continue}
          pb.textContent=total>1?`Posting ${done+1}/${total}…`:'Posting…';
          const pid=newId();
          await put('photos/'+me+'/p/'+pid,{d:it.data},'posts');photoCache[me+':'+pid]=it.data;
          const ing=parseIng(it.ing),steps=String(it.rec||'').trim().slice(0,4000);
          if(steps){await put('recipes/'+me+'/r/'+pid,{steps},'posts');recipeCache[me+':'+pid]=steps}
          myPosts[pid]=Object.assign({date,cap:(it.cap||'').trim(),at:Date.now(),meal:it.meal},ing.length?{ing}:{},steps?{hr:true}:{});it.pid=pid;done++;
        }
        await put('posts/'+me,{items:clone(myPosts)},'posts');
        closeSheet();renderFood();
      }catch(er){
        const saved=items.filter(it=>it.pid);
        if(saved.length){try{await put('posts/'+me,{items:clone(myPosts)},'posts');for(let i=items.length-1;i>=0;i--)if(items[i].pid)items.splice(i,1)}catch(_){saved.forEach(it=>{delete myPosts[it.pid];delete it.pid})}}
        renderFood();
        if(!items.length){closeSheet();return}
        writeErr(er,m=>{note=(saved.length&&items.length?`Posted ${saved.length}. `:'')+m+(items.length?' Tap Post to try the rest.':'')});
        draw();
      }
    };
  };
  draw();
});

function drawDayCal(){
  $('dbtn').setAttribute('aria-expanded',String(dcalOpen));
  if(!dcalOpen){dcw.innerHTML='';return}
  const y=dcalM.getFullYear(),m=dcalM.getMonth(),start=monday(new Date(y,m,1));
  const has=new Set();PEOPLE.forEach(p=>postsOfName(p.id).forEach(x=>has.add(x.date)));
  let cells='';for(let k=0;k<42;k++){const d=new Date(start);d.setDate(start.getDate()+k);if(k===35&&d.getMonth()!==m)break;const fut=d>today;
    const t=d.getTime(),end=pend?t===pend.getTime():(fday&&(t===fday.getTime()||t===fto.getTime())),mid=!pend&&fday&&t>fday.getTime()&&t<fto.getTime();
    cells+=`<button class="dd${d.getMonth()!==m||fut?' out':''}${end?' wk':''}${mid?' rng':''}${t===today.getTime()?' today':''}${has.has(dkey(d))?' has':''}" data-t="${d.getTime()}"${fut?' aria-disabled="true"':''}>${d.getDate()}</button>`}
  dcw.innerHTML=`<div class="cal dcal" role="dialog" aria-label="Pick a day"><div class="cal-head"><button class="navb" id="dcp" aria-label="Previous month">${ICON.left}</button><span>${MONF[m]} ${y}</span><button class="navb" id="dcn" aria-label="Next month">${ICON.right}</button></div><div class="cal-row">${['M','T','W','T','F','S','S'].map(x=>`<div class="dn">${x}</div>`).join('')}</div><div class="cal-row">${cells}</div><div class="cal-foot">${pend?`<span class="cal-hint">Now tap an end date</span><button class="linkish" id="done1">Just this day</button>`:`<span class="cal-hint">Tap a start date, then an end date</span><button class="linkish" id="dall">Show all days</button>`}</div></div>`;
  $('dcp').onclick=e=>{e.stopPropagation();dcalM=new Date(y,m-1,1);drawDayCal()};
  $('dcn').onclick=e=>{e.stopPropagation();dcalM=new Date(y,m+1,1);drawDayCal()};
  const da=$('dall');if(da)da.onclick=e=>{e.stopPropagation();fday=null;fto=null;pend=null;dcalOpen=false;drawDayCal();renderFood()};
  const d1=$('done1');if(d1)d1.onclick=e=>{e.stopPropagation();fday=pend;fto=pend;pend=null;dcalOpen=false;drawDayCal();renderFood()};
  dcw.querySelectorAll('.dd').forEach(b=>b.onclick=e=>{e.stopPropagation();if(b.getAttribute('aria-disabled')==='true')return;
    const d=new Date(+b.dataset.t);
    if(!pend){pend=d;drawDayCal();return}
    const a=pend.getTime()<=d.getTime()?pend:d,z=pend.getTime()<=d.getTime()?d:pend;
    fday=a;fto=z;pend=null;dcalOpen=false;drawDayCal();renderFood()});
}
dcw.addEventListener('click',e=>e.stopPropagation());
$('dbtn').onclick=e=>{e.stopPropagation();if(menuOpen){menuOpen=null;renderFilters()}dcalOpen=!dcalOpen;pend=null;const b=fto||today;dcalM=new Date(b.getFullYear(),b.getMonth(),1);drawDayCal()};

/* ---------- fill your cup ---------- */
let cups={},myCups={},ideas={},myIdeas={};busy.cups=0;busy.ideas=0;
let cday=new Date(today),cweek=monday(today),cnote=null;
function cupText(name,dk){const uid=uidFor(name);if(!uid)return null;
  const src=uid===me?myCups:((cups[uid]&&cups[uid].days)||{});const t=src[dk];return typeof t==='string'?t:null}
function cupSvg(tea,filled){
  return `<svg class="cupsvg" viewBox="0 0 64 56" aria-hidden="true">`+
    `<path d="M12 18h36v12a18 18 0 0 1-36 0z" fill="#FFFAF3" stroke="#8E3F46" stroke-width="3"/>`+
    (filled?`<path d="M14.5 21h31v9a15.5 15.5 0 0 1-31 0z" style="fill:${tea}"/>`:'')+
    `<path d="M48 21h3a6 6 0 0 1 0 12h-4" fill="none" stroke="#8E3F46" stroke-width="3"/>`+
    `<ellipse cx="30" cy="50.5" rx="22" ry="3" fill="#FBF0E2" stroke="#8E3F46" stroke-width="2.6"/></svg>`}
function weekLabel(w){const e=new Date(w);e.setDate(w.getDate()+6);return w.getMonth()===e.getMonth()?`${MON[w.getMonth()]} ${w.getDate()} – ${e.getDate()}`:`${MON[w.getMonth()]} ${w.getDate()} – ${MON[e.getMonth()]} ${e.getDate()}`}
function cupLabel(){const diff=Math.round((today-cday)/864e5),d=dm(cday);return diff===0?`Today · ${d}`:diff===1?`Yesterday · ${d}`:`${WD[cday.getDay()]} · ${d}`}
function allIdeas(){const out=[];allUids(ideas).forEach(uid=>{const src=uid===me?myIdeas:((ideas[uid]&&ideas[uid].items)||{});
  for(const [id,x] of Object.entries(src)){if(x&&typeof x.t==='string'&&x.t.trim())out.push({uid,id,t:x.t.slice(0,120),at:x.at||0})}});return out.sort((a,b)=>a.at-b.at)}

function renderCup(){
  const can=canPost(),mine=myName();
  $('cwlabel').textContent=weekLabel(cweek);
  $('cwnext').setAttribute('aria-disabled',String(cweek.getTime()>=monday(today).getTime()));
  let h='<div></div>'+PEOPLE.map(p=>`<div class="who"><img src="${p.img}" alt="${p.id}"><i style="background:${v(p.c[1])}"></i></div>`).join('');
  for(let i=0;i<7;i++){const d=new Date(cweek);d.setDate(cweek.getDate()+i);const k=dkey(d),fut=d>today,isT=d.getTime()===today.getTime();
    h+=`<div class="dy${isT?' tdy':''}">${DAYS[i]}</div>`;
    PEOPLE.forEach(p=>{const t=cupText(p.id,k),full=t!==null,isMe=p.id===mine&&can,svg=cupSvg(v(p.c[1]),full);
      if(isMe&&!fut)h+=`<button class="cc mine${full?' full':''}" data-n="${p.id}" data-k="${k}" data-i="${i}" aria-label="${full?'Your cup on '+FULL[i]+': '+esc(t):'Fill your cup for '+FULL[i]}">${svg}</button>`;
      else if(full)h+=`<button class="cc full" data-n="${p.id}" data-k="${k}" data-i="${i}" aria-label="${p.id}'s cup on ${FULL[i]}">${svg}</button>`;
      else h+=`<div class="cc${fut?' fut':''}">${svg}</div>`})}
  $('cgrid').innerHTML=h;
  $('cgrid').querySelectorAll('button.cc').forEach(b=>b.onclick=()=>{const n=b.dataset.n,k=b.dataset.k,i=+b.dataset.i;
    if(n===mine&&can){cnote=null;paintNote();const [y,m,d]=k.split('-').map(Number);cday=new Date(y,m-1,d);openCupSheet();return}
    const key=n+'|'+k;cnote=cnote&&cnote.key===key?null:{key,n,k,i};paintNote()});
  paintNote();
  if($('idl'))paintIdeas();
}
function paintNote(){const box=$('cnote');if(!cnote){box.innerHTML='';return}
  const t=cupText(cnote.n,cnote.k);if(t===null){cnote=null;box.innerHTML='';return}
  const p=PEOPLE.find(q=>q.id===cnote.n);
  box.innerHTML=`<div class="note" style="background:${v(p.c[0])};border:0.5px solid ${v(p.c[1])};color:${v(p.c[2])}"><b>${p.id} · ${FULL[cnote.i]}</b><div class="txt"></div></div>`;
  box.querySelector('.txt').textContent=t}

function openCupSheet(){
  if(!canPost())return;const dk=dkey(cday),cur=cupText(myName(),dk);
  openKey=null;
  openSheet(`<div class="sheet" role="dialog" aria-modal="true" aria-label="Fill your cup">
    <div class="sh-head"><div><b>What filled your cup?</b><small>${esc(cupLabel())}</small></div><button class="navb" data-close aria-label="Close">${ICON.x}</button></div>
    <textarea class="field" id="cupin" rows="3" maxlength="300" placeholder="a slow coffee, a walk, a call with a friend…" aria-label="What filled your cup"></textarea>
    <button class="linkish ideatoggle" id="ideatoggle">Need an idea?</button>
    <div class="ingl" id="cupideas" hidden></div>
    <p class="sh-err" id="cuperr" hidden></p>
    <div class="sh-actions">${cur!==null?'<button class="linkish" id="cupclear">Empty my cup</button>':''}<button class="btn ghost" data-close>Cancel</button><button class="btn" id="cupsave">Fill my cup</button></div>
  </div>`);
  const ta=$('cupin'),er=$('cuperr'),box=$('cupideas');ta.value=cur||'';ta.oninput=()=>{er.hidden=true};
  $('ideatoggle').onclick=()=>{const ids=allIdeas();
    box.innerHTML=ids.length?ids.map((x,i)=>`<button class="ing ideapick" data-i="${i}">${esc(x.t)}</button>`).join(''):'<span class="rec-p">No ideas yet.</span>';
    box.querySelectorAll('.ideapick').forEach(b=>b.onclick=()=>{ta.value=ids[+b.dataset.i].t;er.hidden=true;ta.focus()});
    box.hidden=!box.hidden};
  const save=(val)=>{if(val===null)delete myCups[dk];else myCups[dk]=val;closeSheet();renderCup();
    if(val!==null){const c=$('cgrid').querySelector(`button.cc.mine[data-k="${dk}"]`);if(c)c.classList.add('pop')}
    put('cups/'+me,{days:clone(myCups)},'cups').catch(e=>writeErr(e))};
  $('cupsave').onclick=()=>{const t=ta.value.trim();if(!t){er.textContent='Write what filled your cup first.';er.hidden=false;return}save(t)};
  const cl=$('cupclear');if(cl)cl.onclick=()=>save(null);
  if(cur===null)ta.focus();
}

function openIdeas(){
  const can=canPost();openKey=null;
  openSheet(`<div class="sheet" role="dialog" aria-modal="true" aria-label="Cup ideas">
    <div class="sh-head"><div><b>Cup ideas</b></div><button class="navb" data-close aria-label="Close">${ICON.x}</button></div>
    <ul class="idl" id="idl"></ul>
    ${can?`<form class="cmform" id="ideaform"><input class="field" id="ideain" maxlength="120" placeholder="Add your idea…" autocomplete="off" aria-label="Add your idea"><button class="btn" type="submit">Add</button></form><p class="sh-err" id="ideaerr" hidden></p>`:''}
  </div>`);
  paintIdeas();
  const f=$('ideaform');
  if(f){const inp=$('ideain'),er=$('ideaerr');inp.oninput=()=>{er.hidden=true};
    f.onsubmit=e=>{e.preventDefault();const t=inp.value.trim();if(!t){er.textContent='Write an idea first.';er.hidden=false;return}
      myIdeas[newId()]={t:t.slice(0,120),at:Date.now()};inp.value='';paintIdeas();
      put('ideas/'+me,{items:clone(myIdeas)},'ideas').catch(x=>writeErr(x,m=>{er.textContent=m;er.hidden=false}))}}
}
function paintIdeas(){const ul=$('idl');if(!ul)return;const can=canPost(),list=allIdeas();
  ul.innerHTML=list.length?list.map(x=>`<li><span>${esc(x.t)}</span>${x.uid===me&&can?`<button data-id="${esc(x.id)}" aria-label="Remove this idea">×</button>`:''}</li>`).join(''):'<li class="empty">No ideas yet. Add the first one.</li>';
  ul.querySelectorAll('button[data-id]').forEach(b=>b.onclick=()=>{delete myIdeas[b.dataset.id];paintIdeas();
    put('ideas/'+me,{items:clone(myIdeas)},'ideas').catch(x=>writeErr(x,m=>{const er=$('ideaerr');if(er){er.textContent=m;er.hidden=false}}))})}

$('ideabtn').onclick=e=>{e.stopPropagation();openIdeas()};
$('cwprev').onclick=()=>{cweek=new Date(cweek.getFullYear(),cweek.getMonth(),cweek.getDate()-7);cnote=null;renderCup()};
$('cwnext').onclick=()=>{if(cweek.getTime()>=monday(today).getTime())return;cweek=new Date(cweek.getFullYear(),cweek.getMonth(),cweek.getDate()+7);cnote=null;renderCup()};

function setTab(t){
  $('pane-move').hidden=t!=='move';$('pane-food').hidden=t!=='food';$('pane-cup').hidden=t!=='cup';
  $('t-move').setAttribute('aria-selected',String(t==='move'));$('t-food').setAttribute('aria-selected',String(t==='food'));$('t-cup').setAttribute('aria-selected',String(t==='cup'));
  setJig(false);if(calOpen){calOpen=false;drawCal()}if(dcalOpen){dcalOpen=false;drawDayCal()}
  try{localStorage.setItem('shimmy-tab',t)}catch(_){}
  if(t==='food')renderFood();
  if(t==='cup')renderCup();
}
$('t-move').onclick=()=>setTab('move');
$('t-food').onclick=()=>setTab('food');
$('t-cup').onclick=()=>setTab('cup');
let savedTab='move';try{savedTab=localStorage.getItem('shimmy-tab')||'move'}catch(_){}

render();renderBanner();renderFood();renderCup();setTab(['food','cup'].includes(savedTab)?savedTab:'move');

/* ---------- connect to the shared store ---------- */
(async()=>{
  const cl=window.claude;
  const [dbNs,userNs,smNs]=cl&&cl.use?await Promise.all([cl.use('db'),cl.use('user'),cl.use('sample')]):[null,null,null];
  sampler=smNs;
  db=dbNs;me=userNs?await userNs.id():null;
  if(userNs&&me){const w=await userNs.can('data.write');if(w===false)canWrite=false}
  status='ready';
  if(!db){render(false);renderBanner();return}
  db.collection('claims').onSnapshot(s=>{const c={};s.docs.forEach(d=>{c[d.id]=d.data()});if(me&&claims[me]&&!c[me])c[me]=claims[me];claims=c;render(false);renderBanner();renderFood();renderCup()},()=>{});
  db.collection('cups').onSnapshot(s=>{const o={};s.docs.forEach(d=>{o[d.id]=d.data()});cups=o;if(me&&!busy.cups)myCups=clone((o[me]&&o[me].days)||{});renderCup()},()=>{});
  db.collection('ideas').onSnapshot(s=>{const o={};s.docs.forEach(d=>{o[d.id]=d.data()});ideas=o;if(me&&!busy.ideas)myIdeas=clone((o[me]&&o[me].items)||{});renderCup()},()=>{});
  db.collection('posts').onSnapshot(s=>{const o={};s.docs.forEach(d=>{o[d.id]=d.data()});posts=o;if(me&&!busy.posts)myPosts=clone((o[me]&&o[me].items)||{});renderFood()},()=>{});
  db.collection('reacts').onSnapshot(s=>{const o={};s.docs.forEach(d=>{o[d.id]=d.data()});reacts=o;if(me&&!busy.reacts)myReacts=clone((o[me]&&o[me].r)||{});renderFood()},()=>{});
  db.collection('comments').onSnapshot(s=>{const o={};s.docs.forEach(d=>{o[d.id]=d.data()});comments=o;if(me&&!busy.comments)myComments=clone((o[me]&&o[me].c)||{});renderFood()},()=>{});
  db.collection('logs').onSnapshot(s=>{const l={};s.docs.forEach(d=>{l[d.id]=d.data()});logs=l;
    if(me&&!dirty){myDays=JSON.parse(JSON.stringify((l[me]&&l[me].days)||{}))}
    const t=$('txt');const typing=t&&document.activeElement===t;
    render(false);if(sel&&!typing){const m=sel.match(/^(.*?)(\d+)$/);if(m&&entry(m[1],+m[2])!==null)openNote(m[1],+m[2],false);else closeNote()}
  },()=>{});
  db.collection('rewards').onSnapshot(s=>{s.docs.forEach(d=>{const r=d.data().r;if(Array.isArray(r))rewards[d.id]=r});updRewards()},()=>{});
  renderBanner();
})();
</script>
